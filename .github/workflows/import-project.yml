name: Import project archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.import/trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        id: extract
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, io, tarfile
          from pathlib import Path, PurePosixPath

          parts = sorted(Path(".import").glob("part*.txt"))
          if not parts:
              raise SystemExit("No archive parts found")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          archive_data = gzip.decompress(base64.b64decode(encoded, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive_data), mode="r:") as archive:
              for entry in archive.getmembers():
                  path = PurePosixPath(entry.name)
                  if path.is_absolute() or ".." in path.parts or not entry.isfile():
                      continue
                  if path.as_posix() == ".github/workflows/build.yml":
                      continue
                  target = Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(entry)
                  if source is None:
                      raise RuntimeError(f"Cannot read {entry.name}")
                  target.write_bytes(source.read())
          PY
          rm -rf .import
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Commit imported source
        if: steps.extract.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SnakeModMenu source files"
          git push
