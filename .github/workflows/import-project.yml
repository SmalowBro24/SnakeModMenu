name: Import project archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.import/project-archive.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        id: extract
        shell: bash
        run: |
          if [ ! -f .import/project-archive.b64 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import io, zipfile
          from pathlib import Path

          data = Path(".import/project-archive.b64").read_bytes()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              prefix = "SnakeModMenu-project/"
              for entry in archive.infolist():
                  if entry.is_dir() or not entry.filename.startswith(prefix):
                      continue
                  relative = entry.filename[len(prefix):]
                  target = Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
          PY
          rm .import/project-archive.b64
          rmdir .import 2>/dev/null || true
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Commit imported source
        if: steps.extract.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SnakeModMenu source files"
          git push
